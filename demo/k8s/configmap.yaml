apiVersion: v1
kind: ConfigMap
metadata:
  name: refund-demo-config
  namespace: refund-demo
  labels:
    app.kubernetes.io/name: refund-demo
data:
  # The five containers share one network namespace, so they address each other
  # over loopback exactly as they do on a laptop. These are the built-in
  # defaults, restated here so the topology is readable from the manifest.
  AUTH_MODE: "devidp"
  DEVIDP_ISSUER: "http://localhost:8800"
  MCP_A_PUBLIC_URL: "http://localhost:8801"
  MCP_B_PUBLIC_URL: "http://localhost:8802"
  UPSTREAM_API_URL: "http://localhost:8803"

  # No MCP_ALLOWED_HOSTS here on purpose. The MCP transport's DNS rebinding
  # protection allows loopback Host headers out of the box, and inside a single
  # pod every call is already loopback. Compose needs the override because
  # there the Host header is a service name. Add entries here if these
  # containers are ever split into separate pods.

  # NOTE: BIND_HOST is deliberately NOT set here. This ConfigMap is consumed by
  # all five containers via envFrom, and a blanket BIND_HOST=0.0.0.0 would make
  # devidp, mcp-a, mcp-b and upstream listen on the pod IP -- reachable from any
  # other pod in the cluster, with no NetworkPolicy in the way. Only the web
  # container needs to answer the Service, so it sets BIND_HOST on its own env
  # block in deployment.yaml. The other four keep their loopback defaults, which
  # is what makes the claim in service.yaml actually true.

  # Reset mutates the ledger. It stays off on anything with a public address;
  # use scripts/aks-down.ps1 and redeploy to get a clean ledger.
  WEB_ALLOW_RESET: "0"

  # Optional: a Microsoft Foundry deployment for the advisory assess_refund
  # tool. Empty means the tool returns a clearly-labelled offline assessment,
  # so the demo works with no model and no network. Set these (aks-up.ps1
  # -FoundryEndpoint / -FoundryDeployment) to show a third defence layer that
  # lives neither in this app nor in MCP: Azure's content filter rejects the
  # injected order notes before the model ever generates. That is a *result*,
  # not an outage -- and the policy engine still decides the refund either way.
  FOUNDRY_ENDPOINT: ""
  FOUNDRY_DEPLOYMENT: ""
  FOUNDRY_API_VERSION: "2024-10-21"
